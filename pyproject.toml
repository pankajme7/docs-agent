[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "grounded-docs-agent"
version = "0.1.0"
description = "An evaluated documentation agent with RAG, MCP, hosted/local LLMs, and benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pankaj Mehra" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "chromadb>=1.0,<2",
  "httpx>=0.27,<1",
  "mcp[cli]>=2.0,<3",
  "openai>=1.99,<3",
  "psutil>=5.9,<8",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
  "sentence-transformers>=3.4,<6",
  "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
grounded-docs = "grounded_docs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
